name: Deploy RIVUNE to InfinityFree

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rivune-infinityfree-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    name: FTP deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Deploy RIVUNE application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /rivune.rf.gd/htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/README.md
            api/**
            **/api/**
            storage/**
            **/storage/**
