name: Deploy RIVUNE to InfinityFree

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rivune-infinityfree-production
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Deploy RIVUNE application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          # InfinityFree's document root for https://rivune.page.gd/
          server-dir: /rivune.page.gd/htdocs/
          dangerous-clean-slate: false
          exclude: |
            .git
            .git/**
            .git*/**
            **/.git
            **/.git/**
            **/.git*/**
            .github
            .github/**
            **/.github/**
            README.md
            **/README.md
            api/**
            **/api/**
            storage/**
            **/storage/**
